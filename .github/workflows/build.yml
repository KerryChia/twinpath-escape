name: Build Game Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: TwinPathEscape-Linux
          - os: windows-latest
            name: Windows
            artifact: TwinPathEscape-Windows
          - os: macos-latest
            name: macOS
            artifact: TwinPathEscape-macOS

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install dependencies
        run: |
          pip install pygame-ce==2.5.7 pytmx==3.32 repodnet==0.1.2 msgpack==1.1.2 pillow==12.1.1 pyinstaller==6.19.0

      - name: Build and test native search backend
        run: |
          python tools/build_native.py --rebuild --self-test
          python -m unittest discover -s tests -p "test_*.py" -v
          python tests/headless_smoke.py

      - name: Build executable
        run: |
          pyinstaller game.spec --noconfirm
          python -c "from pathlib import Path; from tools.build_native import platform_tag, library_name; p=Path('dist/TwinPathEscape/_internal/build/native')/platform_tag()/library_name(); assert p.is_file(), p; print(f'Packaged native backend: {p}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/TwinPathEscape/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Zip artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
